<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karen&#x27;s Birthday Party - 13 June 2026</title>
  <style>
    :root {
      --page-bg: #faf8f5;
      --text: #222;
      --muted: #777;
      --gap: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 42px 18px 26px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .date {
      margin-top: 12px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--muted);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px 46px;
    }

    .gallery {
      column-count: 2;
      column-gap: var(--gap);
    }

    .photo {
      display: block;
      width: 100%;
      margin: 0 0 var(--gap);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .photo:hover img {
      transform: scale(1.02);
      filter: brightness(0.96);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
    }

    .lightbox.is-open { display: flex; }

    .lightbox img {
      max-width: 96vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .close {
      position: fixed;
      top: 16px;
      right: 18px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: white;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    .close:hover { background: rgba(255, 255, 255, 0.28); }

    @media (max-width: 700px) {
      header { padding: 32px 14px 22px; }
      main { padding: 0 12px 32px; }
      .gallery { column-count: 1; }
      .photo { border-radius: 12px; }
    }
  </style>
</head>

    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <button class="close" type="button" aria-label="Close enlarged photo">&times;</button>
    <img id="lightbox-image" src="" alt="">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeButton = document.querySelector('.close');

    document.querySelectorAll('.photo').forEach((button) => {
      button.addEventListener('click', () => {
        lightboxImage.src = button.dataset.src;
        lightbox.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightboxImage.src = '';
      document.body.style.overflow = '';
    }

    closeButton.addEventListener('click', closeLightbox);

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
    });
  </script>
