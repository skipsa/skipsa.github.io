    .select-button span { font-size:19px; line-height:1; }

    .floating-download { position:fixed; z-index:25; right:max(18px,env(safe-area-inset-right)); bottom:max(18px,env(safe-area-inset-bottom)); border:0; border-radius:999px; padding:14px 20px; background:var(--text); color:white; font-weight:750; font-size:.98rem; box-shadow:0 12px 30px rgba(10,20,30,.28); cursor:pointer; transform:translateY(90px); opacity:0; pointer-events:none; transition:.25s ease; }
    .floating-download.visible { transform:translateY(0); opacity:1; pointer-events:auto; }

    .lightbox { position:fixed; inset:0; z-index:100; display:none; place-items:center; background:rgba(0,0,0,.94); padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom)); }
    .lightbox.open { display:grid; }
    .lightbox img { max-width:100%; max-height:90vh; object-fit:contain; user-select:none; -webkit-user-drag:none; }
    .lightbox button { position:absolute; border:0; border-radius:50%; width:44px; height:44px; background:rgba(255,255,255,.16); color:white; font-size:25px; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .close { top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right)); }
    .prev { left:max(12px,env(safe-area-inset-left)); top:50%; transform:translateY(-50%); }
    .next { right:max(12px,env(safe-area-inset-right)); top:50%; transform:translateY(-50%); }
    .lightbox-counter { position:absolute; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); color:white; font-size:.9rem; }
    .progress { position:fixed; inset:0; z-index:200; display:none; place-items:center; background:rgba(5,12,18,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .progress.show { display:grid; }
    .progress-box { min-width:250px; padding:24px; border-radius:18px; background:white; text-align:center; box-shadow:var(--shadow); }
    .progress-box strong { display:block; margin-bottom:8px; }

    @media (max-width:700px) { header { padding:38px 18px 22px; } main { padding:14px; } .gallery { columns:1; } .photo-card { margin-bottom:14px; border-radius:15px; } .toolbar { justify-content:flex-start; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; } .toolbar::-webkit-scrollbar { display:none; } .prev,.next { display:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const files = ["photo-01.jpg", "photo-02.jpg", "photo-03.jpg", "photo-04.jpg", "photo-05.jpg", "photo-06.jpg", "photo-07.jpg", "photo-08.jpg", "photo-09.jpg", "photo-10.jpg", "photo-11.jpg", "photo-12.jpg", "photo-13.jpg", "photo-14.jpg"];
    const cards=[...document.querySelectorAll('.photo-card')]; const selected=new Set();
    const floatingDownload=document.getElementById('floatingDownload'), downloadTop=document.getElementById('downloadTop'), clearSelection=document.getElementById('clearSelection'), selectAll=document.getElementById('selectAll'), progress=document.getElementById('progress'), progressText=document.getElementById('progressText');
    function updateSelectionUI() { const n=selected.size; floatingDownload.textContent=`Download (${n})`; floatingDownload.classList.toggle('visible',n>0); downloadTop.disabled=n===0; clearSelection.disabled=n===0; selectAll.disabled=n===files.length; cards.forEach(card=>{ const active=selected.has(card.dataset.file); card.classList.toggle('selected',active); card.querySelector('.select-button').setAttribute('aria-pressed',String(active)); }); }
    cards.forEach(card=>card.querySelector('.select-button').addEventListener('click',()=>{ const file=card.dataset.file; selected.has(file)?selected.delete(file):selected.add(file); updateSelectionUI(); }));
    selectAll.addEventListener('click',()=>{files.forEach(f=>selected.add(f));updateSelectionUI();}); clearSelection.addEventListener('click',()=>{selected.clear();updateSelectionUI();});
    async function downloadSelected() { if(!selected.size)return; if(!window.JSZip){alert('The download component could not be loaded. Please check your internet connection and reload the page.');return;} progress.classList.add('show'); try { const zip=new JSZip(); const chosen=files.filter(f=>selected.has(f)); for(let i=0;i<chosen.length;i++){progressText.textContent=`Loading photo ${i+1} of ${chosen.length}`; const response=await fetch(`images/${encodeURIComponent(chosen[i])}`); if(!response.ok)throw new Error(`Could not load ${chosen[i]}`); zip.file(chosen[i],await response.blob());} progressText.textContent='Creating ZIP file'; const blob=await zip.generateAsync({type:'blob',compression:'STORE'}); const zipFile=new File([blob],'Selected-Wakesurf-Photos.zip',{type:'application/zip'}); if(navigator.share&&navigator.canShare&&navigator.canShare({files:[zipFile]})) await navigator.share({files:[zipFile],title:'Selected Wakesurf Photos'}); else {const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download=zipFile.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);} } catch(error){if(error.name!=='AbortError'){console.error(error);alert('The photos could not be prepared. Please reload the page and try again.');}} finally {progress.classList.remove('show');} }
    floatingDownload.addEventListener('click',downloadSelected); downloadTop.addEventListener('click',downloadSelected);
    const lightbox=document.getElementById('lightbox'), lightboxImage=document.getElementById('lightboxImage'), lightboxCounter=document.getElementById('lightboxCounter'); let currentIndex=0;
    function showPhoto(index){currentIndex=(index+files.length)%files.length;lightboxImage.src=`images/${encodeURIComponent(files[currentIndex])}`;lightboxCounter.textContent=`${currentIndex+1} / ${files.length}`;}
    function openLightbox(index){showPhoto(index);lightbox.classList.add('open');document.body.classList.add('no-scroll');lightbox.querySelector('.close').focus();}
    function closeLightbox(){lightbox.classList.remove('open');document.body.classList.remove('no-scroll');lightboxImage.removeAttribute('src');}
    cards.forEach((card,index)=>card.querySelector('.image-button').addEventListener('click',()=>openLightbox(index))); lightbox.querySelector('.close').addEventListener('click',closeLightbox); lightbox.querySelector('.prev').addEventListener('click',()=>showPhoto(currentIndex-1)); lightbox.querySelector('.next').addEventListener('click',()=>showPhoto(currentIndex+1)); lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
    document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')showPhoto(currentIndex-1);if(e.key==='ArrowRight')showPhoto(currentIndex+1);});
    let touchStartX=0; lightbox.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX;},{passive:true}); lightbox.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>55)showPhoto(currentIndex+(dx<0?1:-1));},{passive:true});
  </script>
