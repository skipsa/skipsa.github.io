  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: rgba(255,255,255,.88);
      --text: #111820;
      --muted: #68717b;
      --accent: #087ea4;
      --shadow: 0 14px 34px rgba(25,35,45,.12);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #eef3f6 0, var(--bg) 280px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.no-scroll { overflow: hidden; }
    header {
      max-width: 1240px;
      margin: 0 auto;
      padding: 54px 24px 28px;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(2.15rem, 5vw, 4rem); letter-spacing: -.045em; line-height: 1.02; }
    .subtitle { margin: 13px 0 0; color: var(--muted); font-size: clamp(1rem, 2vw, 1.22rem); }
    .count { margin: 9px 0 0; color: var(--muted); font-size: .95rem; }
    .toolbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
      padding: 11px 16px;
      background: rgba(244,246,248,.82);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,.65);
      border-bottom: 1px solid rgba(35,45,55,.08);
    }
    .toolbar button {
      border: 0; border-radius: 999px; padding: 10px 16px;
      background: white; color: var(--text); font-weight: 650; font-size: .92rem;
      box-shadow: 0 4px 12px rgba(20,30,40,.07); cursor: pointer;
    }
    .toolbar button:disabled { opacity: .42; cursor: default; }
    main { max-width: 1240px; margin: 0 auto; padding: 24px; }
    .gallery { columns: 2; column-gap: 18px; }
    .photo-card {
      position: relative; display: inline-block; width: 100%; margin: 0 0 18px;
      -webkit-column-break-inside: avoid; break-inside: avoid; page-break-inside: avoid;
      vertical-align: top; border-radius: var(--radius); overflow: hidden;
      background: #dfe5e8; box-shadow: var(--shadow);
    }
    .image-button { display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; }
    .photo-card img { display: block; width: 100%; height: auto; transition: transform .35s ease, filter .25s ease; }
    @media (hover: hover) and (pointer: fine) {
      .photo-card:hover img { transform: scale(1.018); }
    }
    .photo-card.selected img { filter: brightness(.84); }
    .select-button {
      position: absolute; z-index: 3; top: 12px; right: 12px;
      width: 36px; height: 36px; padding: 0; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.95); background: rgba(20,30,40,.35);
      color: transparent; box-shadow: 0 3px 12px rgba(0,0,0,.24); cursor: pointer;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .select-button span { font-size: 19px; line-height: 1; }
    .photo-card.selected .select-button { background: var(--accent); color: white; }
    .floating-download {
      position: fixed; z-index: 25; right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      border: 0; border-radius: 999px; padding: 14px 20px;
      background: var(--text); color: white; font-weight: 750; font-size: .98rem;
      box-shadow: 0 12px 30px rgba(10,20,30,.28); cursor: pointer;
      transform: translateY(90px); opacity: 0; pointer-events: none; transition: .25s ease;
    }
    .floating-download.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    footer { text-align: center; color: var(--muted); padding: 28px 20px 48px; font-size: .92rem; }
    .lightbox {
      position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
      background: rgba(0,0,0,.94); padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }
    .lightbox.open { display: grid; }
    .lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .lightbox button {
      position: absolute; border: 0; border-radius: 50%; width: 44px; height: 44px;
      background: rgba(255,255,255,.16); color: white; font-size: 25px; cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .close { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
    .prev { left: max(12px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
    .next { right: max(12px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
    .lightbox-counter { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); color: white; font-size: .9rem; }
    .progress {
      position: fixed; inset: 0; z-index: 200; display: none; place-items: center;
      background: rgba(5,12,18,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .progress.show { display: grid; }
    .progress-box { min-width: 250px; padding: 24px; border-radius: 18px; background: white; text-align: center; box-shadow: var(--shadow); }
    .progress-box strong { display: block; margin-bottom: 8px; }
    .progress-box span { color: var(--muted); }
    @media (max-width: 700px) {
      header { padding: 38px 18px 22px; }
      main { padding: 14px; }
      .gallery { columns: 1; }
      .photo-card { margin-bottom: 14px; border-radius: 15px; }
      .toolbar { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
      .toolbar::-webkit-scrollbar { display: none; }
      .prev, .next { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

  <div class="progress" id="progress" role="status" aria-live="polite">
    <div class="progress-box"><strong>Preparing your photos…</strong><span id="progressText">Starting</span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const files = [
      'Wake-7589.jpg',
      'Wake-7590.jpg',
      'Wake-7591.jpg',
      'Wake-7628.jpg',
      'Wake-7695.jpg',
      'Wake-7700.jpg',
      'Wake-7722.jpg',
      'Wake-7725.jpg',
      'Wake-7727.jpg',
      'Wake-7773.jpg',
      'Wake-7807.jpg',
      'Wake-7809.jpg',
      'Wake-7841.jpg',
      'Wake-7856.jpg',
      'Wake-7887.jpg',
      'Wake-7893.jpg',
      'Wake-7899.jpg',
      'Wake-7922.jpg',
      'Wake-7929.jpg',
      'Wake-7935.jpg'
    ];
    const cards = [...document.querySelectorAll('.photo-card')];
    const selected = new Set();
    const floatingDownload = document.getElementById('floatingDownload');
    const downloadTop = document.getElementById('downloadTop');
    const clearSelection = document.getElementById('clearSelection');
    const selectAll = document.getElementById('selectAll');
    const progress = document.getElementById('progress');
    const progressText = document.getElementById('progressText');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const supportsFileShare = typeof navigator.share === 'function' &&
      typeof navigator.canShare === 'function';

    function actionLabel(n) {
      return isIOS && supportsFileShare ? `Share (${n})` : `Download (${n})`;
    }

    function updateSelectionUI() {
      const n = selected.size;
      floatingDownload.textContent = actionLabel(n);
      downloadTop.textContent = isIOS && supportsFileShare ? 'Share selected' : 'Download selected';
      floatingDownload.classList.toggle('visible', n > 0);
      downloadTop.disabled = n === 0;
      clearSelection.disabled = n === 0;
      selectAll.disabled = n === files.length;
      cards.forEach(card => {
        const active = selected.has(card.dataset.file);
        card.classList.toggle('selected', active);
        card.querySelector('.select-button').setAttribute('aria-pressed', String(active));
      });
    }

    cards.forEach(card => {
      card.querySelector('.select-button').addEventListener('click', () => {
        const file = card.dataset.file;
        selected.has(file) ? selected.delete(file) : selected.add(file);
        updateSelectionUI();
      });
    });

    selectAll.addEventListener('click', () => { files.forEach(f => selected.add(f)); updateSelectionUI(); });
    clearSelection.addEventListener('click', () => { selected.clear(); updateSelectionUI(); });

    async function loadSelectedFiles(chosen) {
      const sharedFiles = [];
      for (let i = 0; i < chosen.length; i++) {
        progressText.textContent = `Loading photo ${i + 1} of ${chosen.length}`;
        const response = await fetch(`images/${encodeURIComponent(chosen[i])}`);
        if (!response.ok) throw new Error(`Could not load ${chosen[i]}`);
        const blob = await response.blob();
        sharedFiles.push(new File([blob], chosen[i], { type: blob.type || 'image/jpeg' }));
      }
      return sharedFiles;
    }

    async function createZip(sharedFiles) {
      if (!window.JSZip) {
        throw new Error('The download component could not be loaded.');
      }
      progressText.textContent = 'Creating ZIP file';
      const zip = new JSZip();
      sharedFiles.forEach(file => zip.file(file.name, file));
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      return new File([blob], 'Selected-Wakesurf-Photos.zip', { type: 'application/zip' });
    }

    async function saveZip(zipFile) {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [zipFile] })) {
        await navigator.share({ files: [zipFile], title: 'Selected Wakesurf Photos' });
        return;
      }
      const url = URL.createObjectURL(zipFile);
      const a = document.createElement('a');
      a.href = url;
      a.download = zipFile.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    async function downloadSelected() {
      if (!selected.size) return;
      progress.classList.add('show');
      try {
        const chosen = files.filter(f => selected.has(f));
        const sharedFiles = await loadSelectedFiles(chosen);

        // On iPhone and iPad, share the JPEGs as separate files. The Share Sheet
        // then offers “Save Images”, which adds them directly to the Photos app.
        if (isIOS && supportsFileShare && navigator.canShare({ files: sharedFiles })) {
          progressText.textContent = 'Opening Share Sheet';
          progress.classList.remove('show');
          await navigator.share({
            files: sharedFiles,
            title: 'Wakesurf Session',
            text: 'Lutry, 28 juillet 2026'
          });
          return;
        }

        // Other devices, or iOS when sharing this selection is unsupported,
        // keep the original ZIP download as a reliable fallback.
        const zipFile = await createZip(sharedFiles);
        await saveZip(zipFile);
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error(error);
          alert('The photos could not be prepared. Try selecting fewer photos, reload the page, and try again.');
        }
      } finally {
        progress.classList.remove('show');
      }
    }
    floatingDownload.addEventListener('click', downloadSelected);
    downloadTop.addEventListener('click', downloadSelected);
    updateSelectionUI();

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxCounter = document.getElementById('lightboxCounter');
    let currentIndex = 0;
    function showPhoto(index) {
      currentIndex = (index + files.length) % files.length;
      lightboxImage.src = `images/${encodeURIComponent(files[currentIndex])}`;
      lightboxCounter.textContent = `${currentIndex + 1} / ${files.length}`;
    }
    function openLightbox(index) {
      showPhoto(index);
      lightbox.classList.add('open');
      document.body.classList.add('no-scroll');
      lightbox.querySelector('.close').focus();
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.classList.remove('no-scroll');
      lightboxImage.removeAttribute('src');
    }
    cards.forEach((card, index) => card.querySelector('.image-button').addEventListener('click', () => openLightbox(index)));
    lightbox.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.prev').addEventListener('click', () => showPhoto(currentIndex - 1));
    lightbox.querySelector('.next').addEventListener('click', () => showPhoto(currentIndex + 1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPhoto(currentIndex - 1);
      if (e.key === 'ArrowRight') showPhoto(currentIndex + 1);
    });
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 55) showPhoto(currentIndex + (dx < 0 ? 1 : -1));
    }, { passive: true });
  </script>
</body>
</html>
